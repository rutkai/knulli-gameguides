# KNULLI Game Guides -- configuration
#
# Every line is "key = value".  Delete a line to fall back to its default.
# Changes take effect the next time the guide is opened; no reboot needed.

# ---------------------------------------------------------------- appearance
# A monospaced face is strongly recommended: GameFAQs guides are full of ASCII
# tables and maps that only line up at a fixed pitch.
font              = /usr/share/fonts/dejavu/DejaVuSansMono.ttf
font_fallbacks    = /usr/share/fonts/dejavu/DejaVuSansMono.ttf:/usr/share/fonts/dejavu/DejaVuSansCondensed.ttf:/usr/share/fonts/dejavu/DejaVuSans.ttf:/usr/share/libretro/assets/ozone/regular.ttf

# Starting text size. "auto" picks whatever renders about target_columns
# characters across, which is how the same setting suits a 640x480 RG35XX and a
# 1920x1080 Retroid alike. GameFAQs guides are laid out for ~79 columns, so at
# 80 their ASCII tables and maps line up. D-pad left/right changes it in-guide
# and the choice is remembered per guide.
font_size         = auto
target_columns    = 80
font_size_min     = 10
font_size_max     = 48

fg                = #e8e8e8
bg                = #101010
accent            = #7fb2ff

margin_x          = 12
margin_y          = 8

# ------------------------------------------------------------------ scrolling
scroll_lines      = 1
page_lines        = 0
repeat_delay      = 0.35
repeat_rate       = 0.035
max_fps           = 30
show_line_counter = 1
help_on_open      = 0

# --------------------------------------------------------------- guide lookup
# Extra directories searched after the ROM's own folder. Colon separated.
# Inside each one both "<dir>/<system>/<game>.txt" and "<dir>/<game>.txt" are
# tried, e.g. /userdata/guides/gba/Metroid Fusion (USA).txt
guide_dirs        = /userdata/guides

# -------------------------------------------------------------------- display
# fb  = paint straight into /dev/fb0. No GPU involvement at all, so it cannot
#       collide with the emulator's EGL surface. This is the default.
# sdl = go through SDL2 (the "mali" fbdev/EGL driver) instead. Try this if
#       "fb" leaves the screen unchanged, or if the guide comes out rotated on
#       a device whose panel is mounted sideways -- SDL applies the same
#       rotation the emulator gets.
renderer          = fb
fbdev             = /dev/fb0

# Panel rotation, in degrees. "auto" uses the same rule KNULLI's own SDL2 mali
# driver uses -- a framebuffer taller than it is wide means the panel is
# mounted sideways, so everything drawn into it gets turned on the way to the
# glass. The SDL_ROTATION environment variable is honoured too, exactly as SDL
# does. If the guide comes out upside down or turned the wrong way on your
# device, set 90, 180 or 270 explicitly.
rotate            = auto

# Force every pixel of the page fully opaque before it is written. This display
# engine can be told to honour the framebuffer's alpha channel (/usr/bin/setalpha
# flips its layer between opaque and transparent), and SDL_ttf's glyph margins
# are transparent, so without this the text turns into see-through bars whenever
# something leaves the layer in transparent mode. Leave it on.
force_opaque      = 1

# These framebuffers are much taller than the screen -- 1024x16384 on a Brick,
# i.e. 21 screen-sized buffer slots that the emulator pans between.
# fb_force_pan uses FBIOPAN_DISPLAY to make our slot the visible one, which is
# what makes the guide appear reliably rather than only when the emulator
# happens to stop on the slot we picked.
fb_force_pan      = 1

# Fallback if the driver ignores panning: paint this many slots every frame
# (0 or 1 = just the live one). 4 covers any sane buffering scheme at the cost
# of ~12 MB of copying per redraw. Run `gameguide.py --probe` to find out
# whether you need it.
fb_all_buffers    = 0

# ----------------------------------------------------------------------- logs
# Empty means /userdata/system/logs/gameguide.log, alongside KNULLI's own logs.
# Set a path here to put it somewhere else.
log_file          =

# --------------------------------------------------------------------- idle
# KNULLI's idlewatcher decides the handheld is idle by reading /dev/input, and
# the guide holds an exclusive grab on those devices while it is open -- so
# without this, reading counts as doing nothing: the screen dims after idle=
# seconds and suspends after extended= (see /etc/idlewatcher/idlewatcher.conf,
# 300s and 900s by default). Activity is reported back on a uinput device.
#
# activity = report it whenever you actually press something (default), so
#            putting the handheld down still lets it sleep on schedule
# always   = keep it awake for as long as the guide is on screen
# off      = do nothing
idle_keepalive          = activity

# Shortest gap between reports, in "activity" mode. No reason to change it.
idle_keepalive_interval = 1.0

# ------------------------------------------------------------------ behaviour
# Suspend (SIGSTOP) the emulator while the guide is open. This is what stops
# the emulator repainting over the guide; turning it off will not work on
# devices without a compositor, which is all of KNULLI's Allwinner handhelds.
stop_emulator     = 1

# Snapshot the framebuffer before drawing and put it back on exit, so the game
# reappears instantly instead of waiting for the emulator's next frame.
restore_framebuffer = 1
